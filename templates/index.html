<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Ticket</title>
    <div style="text-align:right; margin-bottom:15px;">
    <a href="/logout" style="text-decoration:none; color:white; background:#dc3545; padding:10px 15px; border-radius:8px;">Logout</a>
</div>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eaf4ff, #f8fbff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 102, 204, 0.15);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #0b5ed7;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #555;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #1f3b5b;
        }

        input, textarea, select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cfe2ff;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
            background: #f9fcff;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #0b5ed7;
            box-shadow: 0 0 0 3px rgba(11, 94, 215, 0.12);
            background: #fff;
        }

        textarea {
            resize: none;
            min-height: 110px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            background: linear-gradient(90deg, #0b5ed7, #3399ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(11, 94, 215, 0.25);
        }

        .link-box {
            text-align: center;
            margin-top: 20px;
        }

        .link-box a {
            text-decoration: none;
            color: #0b5ed7;
            font-weight: bold;
            transition: 0.3s;
        }

        .link-box a:hover {
            color: #084298;
        }

        .icon-circle {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #0b5ed7, #66b2ff);
            color: white;
            margin: 0 auto 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 8px 20px rgba(11, 94, 215, 0.25);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Create Ticket</h1>
            <p>Raise your issue quickly and easily</p>
        </div>

        <form action="/submit" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="issue">Issue Description</label>
                <textarea id="issue" name="issue" placeholder="Describe your issue here..." required></textarea>
            </div>

            <button type="submit" class="btn">Submit Ticket</button>
        </form>

        <div class="link-box">
            <a href="/view">View All Tickets</a>
        </div>
    </div>
</body>
</html>
