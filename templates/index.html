<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Ticket</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eaf4ff, #ffffff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 450px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 85, 170, 0.15);
        }

        h1 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
            font-size: 34px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #1e3a5f;
        }

        input, textarea, select {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #cfe2ff;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            background: #f8fbff;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #1976d2;
            box-shadow: 0 0 8px rgba(25, 118, 210, 0.2);
            background: white;
        }

        textarea {
            resize: none;
            height: 100px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #1976d2, #42a5f5);
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(25, 118, 210, 0.3);
        }

        .view-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #1565c0;
            font-size: 18px;
            font-weight: bold;
        }

        .view-link:hover {
            color: #0d47a1;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Ticket</h1>

        <form action="/submit" method="POST">
            <label for="name">Name</label>
            <input type="text" name="name" id="name" placeholder="Enter your name" required>

            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="Enter your email" required>

            <label for="issue">Issue</label>
            <textarea name="issue" id="issue" placeholder="Describe your issue" required></textarea>

            <label for="priority">Priority</label>
            <select name="priority" id="priority">
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>

            <button type="submit">Submit Ticket</button>
        </form>

        <a href="/tickets" class="view-link">View Tickets</a>
    </div>
</body>
</html>
