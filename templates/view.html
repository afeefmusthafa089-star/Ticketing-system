<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Admin Panel</h2>

<table class="table">
<tr>
<th>Name</th><th>Issue</th><th>Status</th><th>Action</th>
</tr>

{% for t in tickets %}
<tr>
<td>{{t[1]}}</td>
<td>{{t[3]}}</td>
<td>{{t[5]}}</td>
<td>
    <a href="/update/{{t[0]}}" class="btn btn-success">Close</a>
</td>
</tr>
{% endfor %}

</table>

</body>
</html>
