<!DOCTYPE html>
<html>
<head>
    <title>All Tickets</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            margin:0;
            padding:0;
        }

        .container{
            width: 90%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            color:#444;
            margin-bottom:25px;
        }

        table{
            width:100%;
            border-collapse: collapse;
        }

        th{
            background:#667eea;
            color:white;
            padding:12px;
            text-align:left;
        }

        td{
            padding:12px;
            border-bottom:1px solid #ddd;
        }

        tr:hover{
            background:#f2f2f2;
            transition:0.3s;
        }

        .status{
            padding:5px 10px;
            border-radius:20px;
            font-size:12px;
            color:white;
        }

        .open{
            background:#28a745;
        }

        .low{
            background:#ffc107;
            color:black;
        }

        .back-btn{
            display:inline-block;
            margin-top:20px;
            padding:10px 20px;
            background:#667eea;
            color:white;
            text-decoration:none;
            border-radius:8px;
        }

        .back-btn:hover{
            background:#5a67d8;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🎫 All Tickets</h1>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Issue</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Date</th>
        </tr>

        {% for t in tickets %}
        <tr>
            <td>{{t.id}}</td>
            <td>{{t.name}}</td>
            <td>{{t.email}}</td>
            <td>{{t.issue}}</td>
            <td><span class="status low">{{t.priority}}</span></td>
            <td><span class="status open">{{t.status}}</span></td>
            <td>{{t.date}}</td>
        </tr>
        {% endfor %}
    </table>

    <a href="/" class="back-btn">⬅ Back</a>

</div>

</body>
</html>
