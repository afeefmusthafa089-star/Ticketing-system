<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Tickets</title>
    <a href="/logout" class="home-btn" style="background:#dc3545;">Logout</a>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eaf4ff, #f8fbff);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 102, 204, 0.12);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .top-bar h1 {
            color: #0b5ed7;
            font-size: 34px;
        }

        .home-btn {
            text-decoration: none;
            background: linear-gradient(90deg, #0b5ed7, #3399ff);
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(11, 94, 215, 0.25);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 12px;
        }

        thead {
            background: linear-gradient(90deg, #0b5ed7, #3399ff);
            color: white;
        }

        th, td {
            padding: 15px;
            text-align: left;
        }

        th {
            font-size: 16px;
        }

        tbody tr {
            border-bottom: 1px solid #e6eef8;
            transition: 0.2s;
        }

        tbody tr:hover {
            background: #f4f9ff;
        }

        td {
            color: #333;
            font-size: 15px;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .open {
            background: #d1e7dd;
            color: #0f5132;
        }

        .empty-box {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            font-size: 18px;
        }

        .ticket-count {
            margin-bottom: 20px;
            color: #555;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <h1>All Tickets</h1>
            <a href="/" class="home-btn">+ Create New Ticket</a>
        </div>

        <div class="ticket-count">
            Total Tickets: <strong>{{ tickets|length }}</strong>
        </div>

        {% if tickets %}
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Issue</th>
                        <th>Status</th>
                        <th>Created At</th>
                    </tr>
                </thead>
                <tbody>
                    {% for ticket in tickets %}
                    <tr>
                        <td>{{ ticket[0] }}</td>
                        <td>{{ ticket[1] }}</td>
                        <td>{{ ticket[2] }}</td>
                        <td>
                            <span class="status open">{{ ticket[3] }}</span>
                        </td>
                        <td>{{ ticket[4] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <div class="empty-box">
            No tickets available yet.
        </div>
        {% endif %}
    </div>
</body>
</html>
